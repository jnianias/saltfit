[project]
name = "SALTFit"
version = "0.1.0a1"
description = "An object-oriented Python API for fitting SALT models to spectra with MCMC."
readme = "README.md"
authors = [
    { name = "James Nianias", email = "jnianias@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering"
]
requires-python = ">=3.11"
dependencies = [
  "emcee>=3.1",
  "h5py>=3.16.0",
  "numpy>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
astropy = [
  "astropy>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a separately built official SALT checkout",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "D",
]
ignore = [
  "D107",  # Dataclass constructor is documented by the class docstring.
  "D203",
  "D213",
  "D401",
  "D413",
  "D415",
  "D416",
  "D417",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
